name: AppImage spike (Qt)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spike-qt/**"
      - ".github/workflows/appimage-spike.yml"

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    name: AppImage ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries Qt needs at build/test time
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 file

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials pyinstaller

      - name: Build bundle with PyInstaller
        working-directory: spike-qt
        run: |
          pyinstaller --noconfirm --onedir --windowed --name mkv-tool-suite \
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick app.py

      - name: Assemble AppDir
        working-directory: spike-qt
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/mkv-tool-suite/. AppDir/usr/bin/
          QT_QPA_PLATFORM=offscreen python make_icon.py AppDir/mkv-tool-suite.png
          cp AppDir/mkv-tool-suite.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp mkv-tool-suite.desktop AppRun AppDir/
          du -sh AppDir

      - name: Smoke test the bundle (headless screenshot)
        working-directory: spike-qt
        run: |
          QT_QPA_PLATFORM=offscreen timeout 60 AppDir/AppRun --shot "$PWD/shot-${{ matrix.arch }}.png"
          ls -la shot-${{ matrix.arch }}.png

      - name: Build AppImage
        working-directory: spike-qt
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ../tools-dl
          curl -fsSL -o ../tools-dl/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x ../tools-dl/appimagetool
          ../tools-dl/appimagetool --appimage-extract-and-run AppDir MKVToolSuite-spike-${{ matrix.arch }}.AppImage
          ls -lh MKVToolSuite-spike-${{ matrix.arch }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: MKVToolSuite-spike-${{ matrix.arch }}
          path: |
            spike-qt/MKVToolSuite-spike-${{ matrix.arch }}.AppImage
            spike-qt/shot-${{ matrix.arch }}.png
