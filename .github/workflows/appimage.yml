name: AppImage
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    name: AppImage ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (Qt runtime libs + MKVToolNix + ffmpeg for tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 mkvtoolnix ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials pyinstaller

      - name: Tests
        run: python -m unittest tests.test_core tests.test_ffmpeg tests.test_ui_smoke -v

      - name: Build bundle
        run: |
          pyinstaller --noconfirm --onedir --windowed --name mkv-tool-suite \
            --add-data "mkvsuite/resources:mkvsuite/resources" \
            --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick \
            run_mkvsuite.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/mkv-tool-suite/. AppDir/usr/bin/
          cp mkvsuite/resources/icon.png AppDir/mkv-tool-suite.png
          cp mkvsuite/resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/mkv-tool-suite.png
          cp packaging/mkv-tool-suite.desktop packaging/AppRun AppDir/
          du -sh AppDir

      - name: Smoke test the packaged build (runs the system mkvmerge from inside the bundle)
        run: |
          printf '1\n00:00:00,000 --> 00:00:01,000\nHello\n' > t.srt
          mkvmerge -o t.mkv --language 0:eng t.srt
          AppDir/AppRun --selftest t.mkv
          QT_QPA_PLATFORM=offscreen timeout 120 AppDir/AppRun t.mkv --shot "$PWD/shot-${{ matrix.arch }}.png"
          ls shot-${{ matrix.arch }}-*.png

      - name: Build AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p tools-dl
          curl -fsSL -o tools-dl/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x tools-dl/appimagetool
          tools-dl/appimagetool --appimage-extract-and-run AppDir MKVToolSuite-${{ matrix.arch }}.AppImage
          ls -lh MKVToolSuite-${{ matrix.arch }}.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: MKVToolSuite-${{ matrix.arch }}
          path: |
            MKVToolSuite-${{ matrix.arch }}.AppImage
            shot-${{ matrix.arch }}-*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MKVToolSuite-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "MKV Tool Suite ${{ github.ref_name }}" \
            --notes "AppImages for x86_64 and aarch64. Needs MKVToolNix: sudo apt install mkvtoolnix" \
            MKVToolSuite-*.AppImage
